outcome:
  en: Upgraded the React Native app and added Stripe wallet payments plus in-app purchases.
  ar: رقّيت تطبيق React Native وأضفت الدفع عبر محافظ Stripe والمشتريات داخل التطبيق.
problem:
  en: The live app needed a safer dependency upgrade and more ways for users to pay, without breaking it for existing users.
  ar: احتاج التطبيق المنشور إلى ترقية آمنة للمكتبات وطرق دفع أكثر للمستخدمين، دون أن يتعطّل لمن يستخدمونه حاليًا.
decisions:
  - en: Upgraded the React Native version and updated libraries for performance and security.
    ar: رقّيت إصدار React Native وحدّثت المكتبات لتحسين الأداء والأمان.
  - en: Integrated Google Pay and Apple Pay through the Stripe gateway.
    ar: دمجت Google Pay و Apple Pay عبر بوابة Stripe.
  - en: Set up in-app purchases as an additional revenue stream.
    ar: أعددت نظام المشتريات داخل التطبيق كمصدر دخل إضافي.
  - en: Added Google Analytics so the team could see how people actually used the app.
    ar: أضفت Google Analytics ليرى الفريق كيف يستخدم الناس التطبيق فعليًا.
shipped:
  - en: Upgraded React Native app in the stores
    ar: تطبيق React Native مُرقّى على المتاجر
  - en: Stripe Google Pay and Apple Pay
    ar: الدفع عبر Google Pay و Apple Pay من خلال Stripe
  - en: In-app purchase flow
    ar: مسار المشتريات داخل التطبيق
  - en: Analytics for product decisions
    ar: تحليلات تدعم قرارات المنتج
metric:
