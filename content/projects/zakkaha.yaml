outcome:
  en: Built the account screens, deep links and background push notifications for an Arabic daily-habits app.
  ar: بنيت شاشات الحساب والروابط العميقة والإشعارات في الخلفية لتطبيق عربي للعادات اليومية.
problem:
  en: Zakkaha helps people review their religious, mental, physical and social habits every day, with prayer times, athkar and daily Quran reading. A partner developer needed help finishing the account and notification features before launch.
  ar: يساعد تطبيق زكّاها المستخدم على محاسبة نفسه يوميًا في الجوانب الدينية والعقلية والجسدية والاجتماعية، مع مواقيت الصلاة والأذكار والورد اليومي. احتاج المطور الشريك إلى مساعدة في إنهاء ميزات الحساب والإشعارات قبل الإطلاق.
