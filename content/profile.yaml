aboutTitle:
  en: A product engineer who cares about the release, not just the commit.
  ar: مهندس منتجات يهتم بالإصدار، لا بالكود فقط.
aboutBody:
  en: Computer Science graduate from Al-Azhar University, Gaza. For five years I have shipped React and React Native products for European teams and Arabic-market clients, working in English and Arabic. I mentored students at the Gaza Sky Geeks coding academy in 2017–2018.
  ar: خريج علوم حاسوب من جامعة الأزهر في غزة. خلال خمس سنوات سلّمت منتجات React و React Native لفرق أوروبية وعملاء في السوق العربي، بالعربية والإنجليزية. وأرشدت الطلاب في أكاديمية البرمجة في Gaza Sky Geeks خلال 2017–2018.
