aboutTitle:
  en: A product engineer who cares about the release, not just the commit.
  ar: مهندس منتجات يهتم بالإطلاق والوصول للمستخدم، لا بمجرد رفع الكود.
aboutBody:
  en: >-
    I worked my way through a Computer Science degree at Al-Azhar University,
    Gaza. In my third year I joined the Gaza Sky Geeks coding bootcamp, stayed
    on as a mentor, and got my first paid product work through Tech for Better,
    in a team split between London and Gaza. Since then I have spent five years
    shipping React and React Native products for European teams and
    Arabic-market clients, in English and Arabic, and I finished my degree
    part-time alongside the work in 2026.
  ar: >-
    درست علوم الحاسوب في جامعة الأزهر بغزة وأنا أعمل إلى جانب دراستي. في سنتي
    الثالثة التحقت بمعسكر البرمجة في Gaza Sky Geeks، ثم بقيت فيه مرشدًا، وكان أول
    عمل مدفوع لي على منتج حقيقي عبر برنامج Tech for Better، ضمن فريق موزّع بين
    لندن وغزة. ومنذ ذلك الحين أمضيت خمس سنوات أطوّر وأطلق تطبيقات React و React
    Native لفرق أوروبية وعملاء في العالم العربي، بالعربية والإنجليزية، وأكملت
    دراستي إلى جانب العمل حتى تخرّجت عام 2026.
