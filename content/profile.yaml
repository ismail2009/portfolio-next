heroDescription:
  en: Senior frontend and mobile developer. Five years of production work for EU teams and Arabic-market clients — from TypeScript migrations to apps live on the App Store and Google Play.
  ar: مطور واجهات وتطبيقات موبايل أول. خمس سنوات من العمل الإنتاجي لفرق أوروبية وعملاء في السوق العربي — من التحويل إلى TypeScript حتى تطبيقات منشورة على App Store و Google Play.
