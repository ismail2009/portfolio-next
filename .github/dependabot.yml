version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      keystatic:
        patterns: ["@keystatic/*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
